# Сайт Pacman. Файл ставит deploy/install.sh, подставляя адрес вместо __HOST__.
# Другие сайты на сервере не затрагиваются: блок отвечает только на свой server_name.
server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;

    root __SITE_DIR__;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # файлы с хэшем в имени не меняются никогда
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /og/ {
        expires 1d;
        try_files $uri =404;
    }

    # статистика: сервис видит настоящий адрес посетителя только из этого заголовка, подменить его снаружи нельзя
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 8k;
    }

    location /admin {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
        proxy_read_timeout 120s;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location ~ /\. {
        deny all;
    }
}
